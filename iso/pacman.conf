#
# pacman.conf used by mkarchiso to build Rocket OS, and copied into the live system.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# CachyOS: gaming-tuned kernel, calamares. Listed first so its builds win.
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Locally built rocket-* packages (exists only during a build).
[rocket]
SigLevel = Optional TrustAll
Server = file:///var/tmp/rocket-work/repo
