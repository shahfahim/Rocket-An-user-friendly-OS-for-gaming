title    Rocket OS live (UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash amd_pstate=active console=tty0 console=ttyS0,115200 systemd.show_status=1
