# Runs inside the target after GRUB is installed: Windows fallback entry,
# snapshots submenu name, final grub.cfg. See iso/airootfs/usr/local/bin/rocket-grub-setup.
---
dontChroot: false
timeout: 300
script:
    - command: "/usr/local/bin/rocket-grub-setup"
      timeout: 300
i18n:
    name: "Setting up the boot menu..."
