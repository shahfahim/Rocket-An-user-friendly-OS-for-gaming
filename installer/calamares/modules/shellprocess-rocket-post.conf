# Runs inside the target right after the image is unpacked: removes live-session
# leftovers, sets up the keyring and snapper. See iso/airootfs/usr/local/bin/rocket-post-install.
---
dontChroot: false
timeout: 900
script:
    - command: "/usr/local/bin/rocket-post-install"
      timeout: 900
i18n:
    name: "Configuring Rocket OS..."
